<div class="wrap">
        <div class="section-head section-head--mid reveal">
          <h2>My Journey</h2>
        </div>
      </div>

      <div class="tline" id="timeline">

        <article class="tline__item">
          <div class="tline__side"><span class="tline__dot" aria-hidden="true"></span><h3 class="tline__year">2011</h3></div>
          <div class="tline__body">
            <h3 class="tline__year tline__year--m">2011</h3>
            <div class="tline__grid">
              <picture>
                <source srcset="img/journey/2011-1.avif" type="image/avif">
                <source srcset="img/journey/2011-1.webp" type="image/webp">
                <img src="img/journey/2011-1.jpg" alt="Marvin Balmaceda, 2011"
                     width="720" height="539" loading="lazy" decoding="async">
              </picture>
              <picture>
                <source srcset="img/journey/2011-2.avif" type="image/avif">
                <source srcset="img/journey/2011-2.webp" type="image/webp">

                     width="414" height="414" loading="lazy" decoding="async">
