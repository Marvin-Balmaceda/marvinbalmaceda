<!-- Theme, resolved before first paint so there is no flash of the wrong one.
     Kept inline and tiny on purpose: an external file would race the stylesheet. -->
<script>
  (function () {
    /* Light by default; an explicit choice in localStorage wins. Always writing
       the attribute keeps the toggle's read simple later on. */
    document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light';
    document.documentElement.className = 'js';
  })();
</script>
